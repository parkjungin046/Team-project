<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 페이지 | 박정인 포트폴리오</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- 로그인 화면 -->
  <section id="login-screen" class="login-screen">
    <form id="login-form" class="login-card" autocomplete="off">
      <h1>관리자 로그인</h1>
      <p class="login-desc">프로젝트를 관리하려면 비밀번호를 입력하세요.</p>
      <label for="login-password">비밀번호</label>
      <input
        type="password"
        id="login-password"
        name="password"
        placeholder="비밀번호 입력"
        autocomplete="current-password"
        required
      />
      <button type="submit">로그인</button>
      <p id="login-error" class="error-text" role="alert"></p>
      <p class="login-note">※ 이 브라우저 창을 닫으면 로그인 상태는 자동으로 사라집니다. 다시 열 때는 항상 새로 로그인해야 합니다.</p>
    </form>
  </section>

  <!-- 관리자 화면 -->
  <section id="admin-screen" class="admin-screen" hidden>
    <header class="admin-header">
      <div>
        <h1>프로젝트 관리자 페이지</h1>
        <p>여기서 저장/수정한 "공개" 프로젝트는 웹사이트에 자동으로 반영됩니다.</p>
      </div>
      <button id="logout-btn" class="btn-secondary">로그아웃</button>
    </header>

    <!-- 중복 프로젝트 경고 -->
    <div id="duplicate-panel" class="duplicate-panel" hidden>
      <h2><span class="dot"></span> 중복 의심 프로젝트</h2>
      <div id="duplicate-groups"></div>
    </div>

    <div class="admin-layout">
      <!-- 입력 폼 -->
      <form id="project-form" class="project-form">
        <h2 id="form-title">새 프로젝트 등록</h2>
        <input type="hidden" id="project-id" value="" />

        <label for="field-title">제목</label>
        <input type="text" id="field-title" placeholder="예: 서울시 도시열섬 완화 바람길 분석" />

        <label for="field-role">내가 한 역할</label>
        <input type="text" id="field-role" placeholder="예: 팀장 / 공간 다기준 분석(MCE) 총괄" />

        <label for="field-description">설명</label>
        <textarea id="field-description" rows="5" placeholder="예: 어떤 문제를 어떤 데이터와 방법으로 분석했고, 어떤 결과를 얻었는지 설명해 주세요."></textarea>

        <label for="field-date">날짜</label>
        <input type="text" id="field-date" placeholder="예: 2024.09 - 2024.12" />

        <label for="field-participants">참여인원 수</label>
        <input type="text" id="field-participants" placeholder="예: 4명 (팀장 1, 팀원 3)" />

        <label for="field-notes">참고사항 <span class="optional-tag">(선택 입력)</span></label>
        <textarea id="field-notes" rows="3" placeholder="예: 캡스톤 경진대회 우수상, 원자료 확인 필요 등"></textarea>

        <fieldset class="status-fieldset">
          <legend>공개 상태</legend>
          <label class="status-option">
            <input type="radio" name="status" value="draft" checked />
            <span>초안 (임시저장 — 관리자 화면에만 보이고, 모든 칸을 채우지 않아도 저장 가능)</span>
          </label>
          <label class="status-option">
            <input type="radio" name="status" value="published" />
            <span>공개 (웹사이트에 바로 표시 — 참고사항 외 모든 칸 필수)</span>
          </label>
        </fieldset>

        <p id="form-error" class="error-text" role="alert"></p>

        <div class="form-actions">
          <button type="submit" id="save-btn" class="btn-primary">저장</button>
          <button type="button" id="new-btn" class="btn-secondary">새 프로젝트로 초기화</button>
        </div>
      </form>

      <!-- 프로젝트 목록 -->
      <div class="project-list-panel">
        <h2>등록된 프로젝트 (<span id="project-count">0</span>)</h2>
        <div id="project-list" class="project-list"></div>
      </div>
    </div>
  </section>

  <script src="admin.js"></script>
</body>
</html>
